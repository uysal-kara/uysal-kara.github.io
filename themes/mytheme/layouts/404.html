<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | {{ .Site.Title }}</title>
    <link rel="stylesheet" href="{{ "style.css" | absURL }}" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: #fafafa;
        color: #1a1a1a;
      }
      .error-container {
        text-align: center;
        padding: 40px;
      }
      .error-code {
        font-size: 96px;
        font-weight: 700;
        color: #2563eb;
        margin: 0;
      }
      .error-message {
        font-size: 24px;
        color: #6b6b6b;
        margin: 20px 0;
      }
      .error-description {
        font-size: 16px;
        color: #999999;
        margin-bottom: 30px;
      }
      .back-link {
        display: inline-block;
        padding: 12px 24px;
        background: #2563eb;
        color: white;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 500;
        transition: background 0.2s;
      }
      .back-link:hover {
        background: #1d4ed8;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <h1 class="error-code">404</h1>
      <p class="error-message">Page not found</p>
      <p class="error-description">The page you're looking for doesn't exist or has been moved.</p>
      <a href="{{ .Site.Home.Permalink }}" class="back-link">← Back to Homepage</a>
    </div>
  </body>
</html>
