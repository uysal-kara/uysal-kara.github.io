<footer class="footer">
  <div class="footer-inner">
    <div class="footer-text">
      © {{ now.Year }} {{ .Site.Title }}. All rights reserved.
    </div>
    <div class="footer-links">
      {{ if .Site.Params.github }}
      <a href="https://github.com/{{ .Site.Params.github }}" target="_blank" rel="noopener">GitHub</a>
      {{ end }}
      {{ if .Site.Params.linkedin }}
      <a href="https://www.linkedin.com/in/{{ .Site.Params.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
      {{ end }}
      {{ if .Site.Params.email }}
      <a href="mailto:{{ .Site.Params.email }}">Email</a>
      {{ end }}
    </div>
  </div>
</footer>
