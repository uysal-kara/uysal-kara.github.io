<header class="header">
  <div class="header-inner">
    <div class="site-brand">
      <div class="site-avatar">
        <a href="{{ .Site.Home.Permalink }}">
          <img src="{{ .Site.Params.avatar }}" alt="{{ .Site.Title }} Avatar" />
        </a>
      </div>
      <div>
        <div class="site-name">
          <a href="{{ .Site.Home.Permalink }}">{{ .Site.Title }}</a>
        </div>
        <div class="site-description">{{ .Site.Params.description }}</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
      <nav>
        <ul class="nav-links">
          <li><a href="{{ .Site.Home.Permalink }}" {{ if eq .Title "Home" }}class="active"{{ end }}>Home</a></li>
          <li><a href="{{ "about/" | absURL }}" {{ if eq .Title "About" }}class="active"{{ end }}>About</a></li>
        </ul>
      </nav>
    </div>
  </div>
</header>
