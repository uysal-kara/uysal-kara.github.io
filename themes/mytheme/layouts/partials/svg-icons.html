{{ $params := .Site.Params }}
{{ if $params.github }}<a href="https://github.com/{{ $params.github }}"><i class="svg-icon github"></i></a>{{ end }}
{{ if $params.email }}<a href="mailto:{{ $params.email }}"><i class="svg-icon email"></i></a>{{ end }}
{{ if $params.linkedin }}<a href="https://www.linkedin.com/in/{{ $params.linkedin }}"><i class="svg-icon linkedin"></i></a>{{ end }}
{{ if $params.stackoverflow }}<a href="http://stackoverflow.com/users/{{ $params.stackoverflow }}"><i class="svg-icon stackoverflow"></i></a>{{ end }}
