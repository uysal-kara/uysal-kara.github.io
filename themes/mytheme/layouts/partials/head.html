<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

<title>{{ if .Title }}{{ .Title }} – {{ end }}{{ .Site.Title }}</title>

{{ $styles := resources.Get "css/main.css" }}
{{ with $styles }}
  {{ $styles = . | minify | fingerprint }}
  <link rel="stylesheet" href="{{ .Permalink }}" integrity="{{ .Data.Integrity }}" crossorigin="anonymous">
{{ end }}

{{ if .Params.description }}
<meta name="description" content="{{ .Params.description | truncate 50 }}" />
<meta property="og:description" content="{{ .Params.description | truncate 50 }}" />
{{ else }}
<meta name="description" content="{{ .Site.Params.description }}">
<meta property="og:description" content="{{ .Site.Params.description }}" />
{{ end }}

<meta name="author" content="{{ .Site.Title }}" />
<meta name="keywords" content="Uysal KARA, Software Developer, Java, DDD, TDD, Microservices, Spring Boot" />

{{ if .Title }}
<meta property="og:title" content="{{ .Title }}" />
<meta property="twitter:title" content="{{ .Title }}" />
{{ else }}
<meta property="og:title" content="{{ .Site.Title }} - {{ .Site.Params.description }}" />
<meta property="twitter:title" content="{{ .Site.Title }} - {{ .Site.Params.description }}" />
{{ end }}

<meta property="og:type" content="website" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:site_name" content="{{ .Site.Title }}" />
<meta property="og:locale" content="en_US" />

<meta name="twitter:card" content="summary" />
<meta name="twitter:creator" content="@uysal_kara" />

<link rel="icon" type="image/x-icon" href="{{ "images/favicon.ico" | absURL }}" />
<link rel="apple-touch-icon" href="{{ "images/favicon.ico" | absURL }}" />

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
