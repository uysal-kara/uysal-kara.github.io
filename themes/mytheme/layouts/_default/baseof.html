<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
  <head>
    {{ partial "head.html" . }}
    {{ partial "analytics.html" . }}
  </head>
  <body>
    {{ partial "header.html" . }}
    <main class="container">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ $darkMode := resources.Get "js/dark-mode.js" }}
    {{ with $darkMode }}
    <script src="{{ .Permalink }}"></script>
    {{ end }}
  </body>
</html>
