{{ define "main" }}
<article class="single-post">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    <div class="post-meta">
      <time class="post-meta-date" datetime="{{ .Date.Format "2006-01-02" }}">
        {{ .Date.Format "January 2, 2006" }}
      </time>
      {{ if .Params.tags }}
      <div class="post-tags">
        {{ range .Params.tags }}
        <span class="tag">{{ . }}</span>
        {{ end }}
      </div>
      {{ end }}
    </div>
  </header>
  
  <div class="post-content">
    {{ .Content }}
  </div>
  
  <a href="{{ .Site.Home.Permalink }}" class="back-link">
    ← Back to Home
  </a>
</article>
{{ end }}
