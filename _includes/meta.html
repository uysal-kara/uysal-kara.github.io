<meta charset="utf-8" />
<meta content='text/html; charset=utf-8' http-equiv='Content-Type'>
<meta http-equiv='X-UA-Compatible' content='IE=edge'>
<meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=5.0'>

{% if page.excerpt %}
<meta name="description" content="{{ page.excerpt | strip_html | truncatewords: 50 }}" />
<meta property="og:description" content="{{ page.excerpt | strip_html | truncatewords: 50 }}" />
{% else %}
<meta name="description" content="{{ site.description }}">
<meta property="og:description" content="{{ site.description }}" />
{% endif %}

<meta name="author" content="{{ site.name }}" />
<meta name="keywords" content="Uysal KARA, Software Developer, Java, DDD, TDD, Microservices, Spring Boot" />

{% if page.title %}
<meta property="og:title" content="{{ page.title }}" />
<meta property="twitter:title" content="{{ page.title }}" />
{% else %}
<meta property="og:title" content="{{ site.name }} - {{ site.description }}" />
<meta property="twitter:title" content="{{ site.name }} - {{ site.description }}" />
{% endif %}

<!-- OpenGraph -->
<meta property="og:type" content="website" />
<meta property="og:url" content="{{ site.url }}{{ page.url }}" />
<meta property="og:site_name" content="{{ site.name }}" />
<meta property="og:locale" content="en_US" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary" />
<meta name="twitter:creator" content="@uysal_kara" />

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="{{ site.baseurl }}/images/favicon.ico" />

<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" href="{{ site.baseurl }}/images/favicon.ico" />
