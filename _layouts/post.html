---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>

  <div class="post-meta">
    <span class="post-date">
      {{ page.date | date: "%B %e, %Y" }}
    </span>
    {% if page.tags %}
    <span class="post-tags">
      Tags: {{ page.tags | join: ", " }}
    </span>
    {% endif %}
  </div>

  <div class="entry">
    {{ content }}
  </div>

  <div class="post-footer">
    <a href="{{ site.baseurl }}/" class="read-more">
      ← Back to Blog
    </a>
  </div>

  {% if site.disqus-secret %}
  <div class="comments">
    {% include disqus.html %}
  </div>
  {% endif %}
</article>
