# Source: https://github.com/gohugoio/hugoTemplate/
name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.139.0
      DART_SASS_VERSION: 1.108.2
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      
      - name: Install Dart Sass
        run: |
          mkdir -p ${{ runner.temp }}/dart-sass
          wget -O ${{ runner.temp }}/dart-sass.tar.gz https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz
          tar -xzf ${{ runner.temp }}/dart-sass.tar.gz -C ${{ runner.temp }}
          sudo install -D -m 755 ${{ runner.temp }}/dart-sass/sass /usr/local/lib/dart-sass/sass
          sudo install -D -m 755 ${{ runner.temp }}/dart-sass/src/dart /usr/local/lib/dart-sass/src/dart
          sudo install -D -m 644 ${{ runner.temp }}/dart-sass/src/sass.snapshot /usr/local/lib/dart-sass/src/sass.snapshot
          sudo ln -sf /usr/local/lib/dart-sass/sass /usr/local/bin/sass
          sass --version
      
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1
      
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ github.workspace }}/.cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
